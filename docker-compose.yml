services:
  mysql:
    image: mysql:8.4
    container_name: metermind-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metermind}
      MYSQL_USER: ${MYSQL_USER:-metermind}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-metermind_local_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_secret}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - metermind_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_local_secret", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  metermind_mysql_data:
