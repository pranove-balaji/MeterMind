spring.application.name=MeterMind

# ------------------------------------------------------------------------------
# Datasource Configuration (Environment-driven with safe local defaults)
# Default port 3307 aligns with local docker-compose.yml to avoid clashing with
# existing host MySQL instances on 3306. Overridable via SPRING_DATASOURCE_URL.
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/metermind?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:metermind}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:metermind_local_secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Flyway Database Migrations
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
